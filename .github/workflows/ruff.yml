name: Ruff

on:
  push:
    branches: [ main ]
    paths: [ "**.py", "pyproject.toml", "uv.lock", ".github/workflows/ruff.yml" ]
  pull_request:
    branches: [ main ]
    paths: [ "**.py", "pyproject.toml", "uv.lock", ".github/workflows/ruff.yml" ]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Use the ruff version locked in uv.lock, the same one `uv run ruff` uses locally.
      - run: uv run --frozen --only-group dev ruff check
      - run: uv run --frozen --only-group dev ruff format --check --diff
